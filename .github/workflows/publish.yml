# l3io-wp-config publish.
#
# DELIBERATELY A SEPARATE FILE FROM ci.yml, AND act MUST NEVER RUN IT.
# act has no OIDC and ignores `job.permissions` entirely, so an `if:` guard
# would not protect this — act would run the publish job and fail confusingly.
# File separation is the only reliable boundary. The repo .actrc points act at
# ci.yml; keep it that way.
#
# Release ORDER across the three packages is manual: l3io-wp-config, then
# l3io-wp-database, then l3io-wp-backup. This package is FIRST — nothing else
# can publish until it resolves from the index.
#
# There is no version floor: this publishes as `l3io-wp-config`, a name that has
# never been published, so no version is spent for it. The tag is the version
# (AD-30), and a tagged publish must ship a final version rather than a dev build.

name: Publish

on:
  push:
    tags: ['v*']
  # A release cut from an EXISTING tag fires no `push: tags` event, so without this
  # "create a release" would silently not mirror. Duplicate fires are safe: the mirror
  # is idempotent (see publish-mirror's pre-check).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        # `mirror` publishes ONLY to the internal Gitea registry. It exists so the
        # first ever run of this workflow can happen somewhere reversible: Gitea
        # packages can be deleted, whereas PyPI and TestPyPI burn a filename
        # permanently and a mistake there costs the version number forever.
        options: [mirror, testpypi, pypi]
        default: mirror

permissions: {}

jobs:
  preflight:
    # `secrets` is NOT available in a job-level `if:` — only github, needs, vars and inputs
    # are. An `if:` referencing secrets does not error; it evaluates empty and SILENTLY
    # SKIPS the job, which for a publish is the worst available outcome. `secrets` IS
    # available in a step's env, so the check happens here and leaves a boolean behind.
    name: is the mirror configured?
    runs-on: ubuntu-latest
    outputs:
      mirror_enabled: ${{ steps.check.outputs.mirror_enabled }}
    steps:
      - id: check
        env:
          MIRROR_URL: ${{ vars.PYPI_CUSTOM_URL }}
          MIRROR_USER: ${{ secrets.PYPI_CUSTOM_USERNAME }}
          MIRROR_TOKEN: ${{ secrets.PYPI_CUSTOM_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${MIRROR_URL}" ] && [ -n "${MIRROR_USER}" ] && [ -n "${MIRROR_TOKEN}" ]; then
            echo "mirror_enabled=true" >> "$GITHUB_OUTPUT"
            echo "mirror configured"
          else
            echo "mirror_enabled=false" >> "$GITHUB_OUTPUT"
            # ${VAR:+set} reports presence without ever echoing a value, so a skip is
            # diagnosable from the log without leaking anything.
            echo "mirror not configured: url:${MIRROR_URL:+set} user:${MIRROR_USER:+set} token:${MIRROR_TOKEN:+set}"
          fi

  version-gate:
    # Runs for BOTH triggers; the tag steps skip on a dispatch. (no floor)
    # the fork's 1.4 can never be re-uploaded. That was prose in AGENTS.md; here
    # it is a gate.
    #
    # Runs for BOTH triggers. A workflow_dispatch has no tag, so the tag steps are
    # skipped and only the floor is enforced; a tag push additionally has to agree
    # with pyproject.toml, which catches publishing a version nobody tagged.
    name: validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Tag info
        id: tag-info
        if: startsWith(github.ref, 'refs/tags/v')
        uses: LiquidLogicLabs/git-action-tag-info@v2
        with:
          tag-name: ${{ github.ref_name }}

      - name: Parse version tag
        id: semver
        if: startsWith(github.ref, 'refs/tags/v')
        uses: LiquidLogicLabs/git-action-tag-validate-version@v2
        with:
          tag: ${{ steps.tag-info.outputs.name }}
          version-type: regex
          version-regex: '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$'

      - name: the tag version parsed
        # There is no version floor. The old one refused anything below 1.5.0 on the
        # grounds that PyPI burned 1.4 -- true of the `wpconfigr` distribution, which
        # ADR-0002 planned to reclaim and ADR-0012 superseded. This publishes as
        # `l3io-wp-config`, which has never been published (PyPI 404), so no version
        # is spent for this name and the floor was guarding a premise that no longer
        # holds.
        #
        # Checked against the TAG, not pyproject. The tag is now the version
        # (AD-30), pyproject carries no literal, and the previous spelling --
        # tomllib.load(...)["project"]["version"] -- raises KeyError the moment
        # the version becomes dynamic. Loud rather than silent, but broken.
        #
        # The tag/artifact agreement that used to live here moved to `smoke`,
        # where the built wheel exists: comparing the tag to a value the build
        # did not actually use cannot detect a build that derived a different one.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys

          tag = (os.environ.get("TAG_VERSION") or "").lstrip("v")
          if not tag:
              sys.exit("the tag version was not parsed; refusing to guess")

          print(f"tag version parsed as {tag}")
          PY

  build:
    name: build distributions
    runs-on: ubuntu-latest
    needs: [version-gate]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
      - name: build
        # --no-sources so a release cannot silently depend on a local path source
        run: uv build --no-sources
      - name: check metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    # The release gate, run before anything is published: the built artifact
    # must install and import in a clean environment on every supported
    # interpreter. A failure here stops the release rather than the user.
    name: clean install · py${{ matrix.python }}
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python }}
      - name: install, import, and agree on one version
        run: |
          set -euo pipefail
          # Exactly one wheel, asserted rather than assumed. `ls dist/*.whl`
          # returns every match, so a stale artifact silently expands to two
          # paths; with no match it returns the literal glob.
          count=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found $count"
            find dist -maxdepth 1 -name '*.whl'
            exit 1
          fi
          wheel=$(find dist -maxdepth 1 -name '*.whl')
          uv run --isolated --no-project --python "${{ matrix.python }}" \
                 --with "$wheel" \
                 python - <<'PY'
          from importlib.metadata import version
          from l3io.wp import config
          attr = config.__version__
          dist = version("l3io-wp-config")
          if attr != dist:
              raise SystemExit(
                  f"version drift: l3io.wp.config.__version__ is {attr!r} "
                  f"but the l3io-wp-config distribution reports {dist!r}"
              )
          print("import ok", sorted(config.__all__))
          print(f"one version: {attr}")
          PY

      - name: a tagged publish must not ship a dev version
        # This replaces a 1.5.0 floor whose premise is gone (see version-gate). The
        # floor was also catching something real BY SIDE EFFECT: a dev build derives
        # 0.1.devN, whose release tuple (0, 1) fell below it, so deleting the floor
        # outright would let a dev build publish as a release.
        #
        # Conditioned on a tag, because a dev build reaching the internal mirror is
        # deliberate -- `make release dev` exists to do exactly that, with no tag and
        # no GitHub release.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl')
          built=$(uv run --isolated --no-project --python "${{ matrix.python }}" \
                    --with "$wheel" \
                    python -c "from importlib.metadata import version; print(version('l3io-wp-config'))")
          python3 - "$built" <<'PY'
          import sys
          from packaging.version import Version
          built = Version(sys.argv[1])
          if built.is_devrelease or built.is_prerelease:
              raise SystemExit(f"built version {built} is a dev/pre-release; a tag must ship a final version")
          print(f"built version {built} is a final release")
          PY

      - name: a tag must agree with the artifact it publishes
        # The authoritative tag check. Compares the tag against the wheel's own
        # metadata, so it covers the tag, pyproject's dynamic resolution and
        # hatch-vcs's derivation in one assertion -- and catches a shallow
        # checkout, which silently derives 0.1.devN with the job green.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl')
          built=$(uv run --isolated --no-project --python "${{ matrix.python }}" \
                    --with "$wheel" \
                    python -c "from importlib.metadata import version; print(version('l3io-wp-config'))")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tagged" ]; then
            echo "::error::tag $tagged does not match the built version $built"
            exit 1
          fi
          echo "tag and artifact agree on $built"

  namespace:
    # AD-27 — the l3io.wp namespace is PEP 420 native. A distribution shipping an
    # __init__.py at l3io/ or l3io/wp/ shadows the namespace and makes its
    # siblings unimportable.
    #
    # The sibling repositories run a three-way coexistence check that installs
    # all three wheels into one interpreter. This package CANNOT: it is first in
    # the release order, so l3io-wp-database and l3io-wp-backup are not on the
    # index yet and `--with` would fail on resolution, not on the invariant.
    # What is checkable here is that THIS distribution ships no marker, which is
    # this package's entire contribution to the invariant. The cross-package
    # check runs in the later pipelines, where the siblings exist.
    name: namespace hygiene
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
      - name: this distribution ships no namespace marker
        run: |
          set -euo pipefail
          # Exactly one wheel, asserted rather than assumed: `ls dist/*.whl`
          # expands to every match, so a stale artifact makes this a nonsense
          # argument, and with no match it yields the literal glob.
          count=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found $count"
            find dist -maxdepth 1 -name '*.whl'
            exit 1
          fi
          uv run --isolated --no-project \
                 --with "$(find dist -maxdepth 1 -name '*.whl')" \
                 python - <<'PY'
          import pathlib, sys
          import l3io, l3io.wp, l3io.wp.config
          for pkg in (l3io, l3io.wp):
              for entry in pkg.__path__:
                  marker = pathlib.Path(entry) / "__init__.py"
                  if marker.exists():
                      sys.exit(f"AD-27 — {marker} shadows the PEP 420 namespace")
          print("namespace ok:", list(l3io.wp.__path__))
          PY

      - name: dependency metadata is clean in BOTH artifacts
        # AD-2 plus ADR-0007's --no-sources guarantee, checked on the bytes being
        # shipped rather than asserted in prose. A git or path source resolving on
        # the maintainer's machine and nowhere else is how a release breaks
        # silently -- it is what made wpbackup2 unresolvable for six years.
        #
        # Inspects Requires-Dist LINES specifically. A bare grep for a hostname
        # cries wolf: Project-URL entries and any README link embedded in the long
        # description both contain URLs legitimately, and a check that fires on
        # those gets switched off.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, tarfile, zipfile

          def requires(text):
              return [l for l in text.splitlines() if l.startswith("Requires-Dist")]

          wheel = glob.glob("dist/*.whl")[0]
          z = zipfile.ZipFile(wheel)
          wheel_md = z.read(next(n for n in z.namelist() if n.endswith("METADATA"))).decode()

          sdist = glob.glob("dist/*.tar.gz")[0]
          tf = tarfile.open(sdist)
          sdist_md = tf.extractfile(
              next(n for n in tf.getnames() if n.endswith("PKG-INFO"))
          ).read().decode()

          problems = []
          for label, lines in (("wheel", requires(wheel_md)), ("sdist", requires(sdist_md))):
              # AD-2: this package declares no runtime dependencies, permanently.
              if lines:
                  problems.append(f"{label} declares runtime dependencies: {lines}")
              # And no direct reference could survive even if that ever changed.
              for line in lines:
                  if any(m in line for m in ("git+", "@ git", "file://", "http://", "https://")):
                      problems.append(f"{label} carries a direct reference: {line}")

          if problems:
              sys.exit("ADR-0007 / AD-2 — " + "; ".join(problems))
          print("dependency metadata clean in wheel and sdist")
          PY

  publish-testpypi:
    name: publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [smoke, namespace]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/l3io-wp-config
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [smoke, namespace]
    # Deliberately NOT triggered by a tag. PyPI burns a filename permanently, so
    # publishing there is an explicit act rather than a side effect of tagging.
    # Tagging produces a GitHub Release and, if configured, an internal mirror
    # push; PyPI requires choosing it.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' 
    environment:
      name: pypi
      url: https://pypi.org/p/l3io-wp-config
    permissions:
      id-token: write   # trusted publishing — no long-lived token
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # The GitHub release for a tagged publish, created after PyPI has accepted
    # the distribution rather than before, so a failed upload leaves no release
    # pointing at something that was never published.
    name: create release
    runs-on: ubuntu-latest
    needs: [smoke, namespace, publish-pypi]
    # Runs when the gates passed and PyPI either succeeded or was never attempted.
    # It must NOT run when a PyPI publish FAILED -- a release pointing at a version
    # that failed to publish is worse than no release. `always()` is required so
    # this is evaluated at all when publish-pypi is skipped.
    # `github.event_name == 'push'` is load-bearing since the release trigger was added.
    # On a `release: published` event github.ref is also refs/tags/v*, so without this the
    # job would fire and try to create the very release that triggered it.
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.smoke.result == 'success' &&
      needs.namespace.result == 'success' &&
      needs.publish-pypi.result != 'failure' &&
      needs.publish-pypi.result != 'cancelled'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }

      - name: build the release notes from the commit log
        # Notes come from commit messages, not a hand-maintained file: one source
        # rather than two that drift. COMMIT mode because this repo's history is
        # direct commits to main -- PR mode, the action's default, returns nothing.
        #
        # `configuration` is a path READ FROM THE WORKING TREE, which is why this
        # job checks out. A release job that only downloads the artifact has no
        # working tree, so the config is silently absent and the builder falls back
        # to defaults with no error.
        id: notes
        uses: LiquidLogicLabs/git-action-release-changelog-builder@v3
        with:
          platform: github
          token: ${{ secrets.GITHUB_TOKEN }}
          mode: COMMIT
          to-tag: ${{ github.ref_name }}
          configuration: .github/changelog-config.json
          fail-on-error: 'false'

      - uses: LiquidLogicLabs/git-action-release@v2
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.notes.outputs.changelog }}
          # The fallback: if the build returns nothing, the platform generator runs
          # instead, so a release is never published bodyless.
          generate-release-notes: ${{ steps.notes.outputs.changelog == '' }}

  publish-mirror:
    # Optional internal Gitea package registry. Token auth, because a Gitea
    # registry does not do trusted publishing. Skipped entirely when the vars
    # and secrets are absent, so a fork or a clean clone is unaffected.
    name: mirror to internal registry
    runs-on: ubuntu-latest
    needs: [smoke, namespace, preflight]
    # Gated on the TARGET as well as on being configured. Without the event condition
    # this ran on every trigger, so a TestPyPI dry run would also push to the internal
    # registry -- publishing somewhere the operator did not choose.
    if: >-
      needs.preflight.outputs.mirror_enabled == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'mirror'))
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
      # Re-publishing a version that is already in the registry must be a NO-OP, not a
      # failure: publish-mirror runs on every tag, so a re-tag or a re-run of an existing
      # release would otherwise fail the whole workflow on a 409 "package file already
      # exists". That happened on the v1.5.0 tag, whose artifacts were already mirrored.
      #
      # `uv publish --check-url` does NOT solve it here — verified: the check URL is the
      # authenticated simple index, the check does not receive the publish credentials, and
      # uv falls through to uploading and 409s anyway.
      #
      # The API URL is derived from vars.PYPI_CUSTOM_URL rather than hardcoded, so the two
      # cannot drift. A non-Gitea index has no /api/v1/ equivalent and answers 404, which
      # degrades to "publish and let the server decide" — the previous behaviour.
      - name: is this version already in the registry?
        id: mirrored
        env:
          REGISTRY_URL: ${{ vars.PYPI_CUSTOM_URL }}
          REG_USER: ${{ secrets.PYPI_CUSTOM_USERNAME }}
          REG_PASS: ${{ secrets.PYPI_CUSTOM_PASSWORD }}
        run: |
          set -euo pipefail
          # Name and version come from the WHEEL FILENAME, not pyproject.toml: this job
          # downloads the artifact and never checks out the repo, so pyproject.toml does not
          # exist here. It is also the better source — the question is whether THESE files
          # are already in the registry, not what the repo currently declares.
          read -r name version < <(python3 - <<'PY'
          import glob, pathlib, re
          stem = pathlib.Path(sorted(glob.glob("dist/*.whl"))[0]).name
          dist, ver = stem.split("-")[0], stem.split("-")[1]
          print(re.sub(r"[-_.]+", "-", dist).lower(), ver)   # PEP 503 normalisation
          PY
          )
          api=$(printf '%s' "$REGISTRY_URL" | sed 's#/api/packages/#/api/v1/packages/#')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                   -u "$REG_USER:$REG_PASS" "$api/$name/$version/files")
          echo "$name $version -> http $code"
          # Skip ONLY on an explicit 200. Anything else (404, or a transport error) means
          # publish and let the registry be the authority, rather than skipping on ambiguity.
          if [ "$code" = "200" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name $version is already in the registry — skipping upload"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: upload
        if: steps.mirrored.outputs.present != 'true'
        env:
          UV_PUBLISH_URL: ${{ vars.PYPI_CUSTOM_URL }}
          UV_PUBLISH_USERNAME: ${{ secrets.PYPI_CUSTOM_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_CUSTOM_PASSWORD }}
        run: uv publish dist/*
