[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "l3io-wp-config"
version = "1.5.0"
description = "Read and write define() constants in a WordPress wp-config.php file."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shawn Anderson" }]
keywords = ["wordpress", "wp-config", "configuration", "php"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

# AD-2: zero runtime dependencies, permanently. This list must stay empty.
# Anything needed by two packages moves down here only if it arrives
# dependency-free; otherwise it is duplicated deliberately and recorded.
dependencies = []

[project.scripts]
l3io-wp-config = "l3io.wp.config.cli.main:main"

[project.urls]
Homepage = "https://github.com/ravensorb/py-wpconfigr"
Repository = "https://github.com/ravensorb/py-wpconfigr"

# PEP 735. Not published, so AD-2's zero-dependency promise holds in the
# distributed metadata and not merely at runtime.
[dependency-groups]
dev = [
    "ruff==0.16.7",          # pinned exactly: pre-1.0, per shared context
    "mypy>=2.3.1,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
]

# AD-27: the wheel ships the l3io/ and l3io/wp/ directories WITHOUT __init__.py
# markers, so l3io.wp stays a PEP 420 native namespace. Adding an __init__.py at
# either level makes this a regular package and makes its siblings unimportable.
# The lockfile must be generated by the same uv CI uses. A lock written by a
# different uv can resolve differently and fail `uv sync --locked` in CI while
# passing locally -- a failure that only appears on the machine you cannot debug.
# Pinned exactly, and enforced here rather than documented, so a mismatched uv
# fails loudly instead of silently writing a divergent lock.
[tool.uv]
required-version = "==0.11.6"

[tool.hatch.build.targets.wheel]
packages = ["src/l3io"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
# BMad tooling and harness directories are vendored, not project code.
extend-exclude = ["_bmad", "_bmad-output", ".claude", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "BLE"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "tools"]
# AD-27: l3io.wp is a PEP 420 native namespace. mypy cannot infer the package root
# without these and will instead SUGGEST adding an __init__.py -- which would make
# this a regular package and render l3io-wp-database and l3io-wp-backup unimportable.
# Never take that suggestion.
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# Test functions are not public surface, so they are type-checked but not
# required to carry annotations. Everything under src/ stays fully strict.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=l3io.wp.config --cov-report=term-missing"
